autoInstallPeers: true
strictPeerDependencies: false

# Packages we maintain ourselves, so the cooling-off period buys nothing.
minimumReleaseAgeExclude:
  - find-installed-packages

packages:
  - apps/*
  - packages/*
  - packages/*/fixtures2/**
  - packages/*/fixtures/**
  - test-apps/*
  - test-plugins/*
