name: release
on:
  push:
    branches: [main]

jobs:
  code:
    uses: clibuilder/.github/.github/workflows/pnpm-verify.yml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Secretless: GITHUB_TOKEN for the version PR, npm trusted publishing (OIDC) to
  # publish. No CI_GITHUB_TOKEN, NPM_TOKEN or GitHub App key, so nothing to rotate.
  # npm validates the caller workflow, so the trusted publisher is registered against
  # this file rather than the reusable one; keep its name and path.
  release:
    uses: clibuilder/.github/.github/workflows/pnpm-release-changeset.yml@main
    needs: code
    permissions:
      # Mints the OIDC token npm exchanges for short-lived publish credentials.
      id-token: write
      # Pushes the version branch and tags.
      contents: write
      # Opens the "version packages" PR with GITHUB_TOKEN.
      pull-requests: write
      # Approves the version PR's runs, which GitHub parks as action_required
      # because github-actions[bot] pushed them.
      actions: write
