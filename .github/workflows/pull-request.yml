name: pull-request
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  code:
    uses: clibuilder/.github/.github/workflows/pnpm-verify.yml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install
      - run: pnpm web typecheck
      - run: pnpm web build

  args-minus-runtimes:
    name: args-minus runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter args-minus build
        env:
          ARGS_MINUS_RUNTIMES: all

  cjs-consumer-node-floor:
    name: CommonJS consumer on Node 20.19
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=test-cli...
      # the packages are ESM-only: test-cli loads them with require(), which needs require(esm), unflagged from Node 20.19.
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
      - run: node --version
      - run: node --test bin.test.mjs axi.test.mjs entries.test.js no-top-level-await.test.js
        working-directory: test-apps/test-cli
